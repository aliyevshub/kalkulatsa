<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yulduz Ovchisi</title>
<style>
  :root { --bg:#0b1026; --fg:#f4f6ff; --accent:#ffd84d; --danger:#ff4d6d; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #ui { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:16px; gap:12px;
    background:rgba(11,16,38,.78); }
  #ui.hidden { display:none; }
  h1 { margin:0; font-size:clamp(32px,8vw,64px); color:var(--accent);
    text-shadow:0 0 24px rgba(255,216,77,.6); }
  p { margin:0; max-width:420px; line-height:1.5; opacity:.9; }
  button { font:inherit; font-size:20px; font-weight:700; padding:14px 36px; border:0;
    border-radius:999px; background:var(--accent); color:#1a1a1a; cursor:pointer;
    box-shadow:0 6px 0 #b8941a; }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #b8941a; }
  #score-big { font-size:48px; font-weight:800; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Yulduz Ovchisi</h1>
  <p id="msg">Savatni harakatlantirib, yulduzlarni tuting!<br>
    ⭐ +1 &nbsp; 💎 +5 &nbsp; ❤️ jon &nbsp; 💣 — tegmang!<br>
    <small>Boshqaruv: barmoq / sichqoncha yoki ← → tugmalari</small></p>
  <div id="score-big"></div>
  <button id="play">O'YNASH</button>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const ui = document.getElementById('ui'), msg = document.getElementById('msg');
  const big = document.getElementById('score-big'), btn = document.getElementById('play');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : +v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  let best = store.get('yulduz_best', 0);

  // Ovoz (WebAudio, tashqi fayllarsiz)
  let ac = null;
  function beep(freq, dur = .08, type = 'sine', vol = .15) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch {}
  }

  const bgStars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .3, s: Math.random() * .3 + .05 }));
  const KINDS = {
    star:  { emoji: '⭐', pts: 1 },
    gem:   { emoji: '💎', pts: 5 },
    heart: { emoji: '❤️', pts: 0 },
    bomb:  { emoji: '💣', pts: 0 },
  };

  let state = 'menu', paused = false;
  let basket, items, parts, score, lives, combo, t, spawnT, shake, keys = {};

  function reset() {
    basket = { x: W / 2, w: Math.max(80, Math.min(140, W * .22)), tx: W / 2 };
    items = []; parts = []; score = 0; lives = 3; combo = 0; t = 0; spawnT = 0; shake = 0;
  }

  function spawn() {
    const lvl = 1 + t / 20;
    const r = Math.random();
    const kind = r < .62 ? 'star' : r < .70 ? 'gem' : r < .73 && lives < 5 ? 'heart' : r < .73 ? 'star' : 'bomb';
    items.push({ kind, x: 24 + Math.random() * (W - 48), y: -30,
      vy: (120 + Math.random() * 80) * Math.min(lvl, 3.2), rot: Math.random() * 6, vr: (Math.random() - .5) * 4 });
  }

  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 200;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, color });
    }
  }

  function update(dt) {
    t += dt;
    if (keys.ArrowLeft || keys.a) basket.tx -= 700 * dt;
    if (keys.ArrowRight || keys.d) basket.tx += 700 * dt;
    basket.tx = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.tx));
    basket.x += (basket.tx - basket.x) * Math.min(1, dt * 18);

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(.28, .9 - t / 60); }

    const by = H - 70;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt; it.rot += it.vr * dt;
      const caught = it.y > by - 20 && it.y < by + 20 && Math.abs(it.x - basket.x) < basket.w / 2 + 10;
      if (caught) {
        items.splice(i, 1);
        if (it.kind === 'bomb') {
          lives--; combo = 0; shake = .4; burst(it.x, it.y, '#ff4d6d', 30); beep(90, .3, 'sawtooth', .25);
          if (navigator.vibrate) navigator.vibrate(120);
          if (lives <= 0) return gameOver();
        } else if (it.kind === 'heart') {
          lives = Math.min(5, lives + 1); burst(it.x, it.y, '#ff7aa2'); beep(660, .15, 'triangle');
        } else {
          combo++;
          const mult = 1 + Math.floor(combo / 10);
          score += KINDS[it.kind].pts * mult;
          burst(it.x, it.y, it.kind === 'gem' ? '#6ee7ff' : '#ffd84d');
          beep(it.kind === 'gem' ? 1040 : 520 + Math.min(combo, 20) * 20, .08);
        }
      } else if (it.y > H + 40) {
        items.splice(i, 1);
        if (it.kind === 'star' || it.kind === 'gem') combo = 0;
      }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    shake = Math.max(0, shake - dt);
  }

  function draw(dt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1026'); g.addColorStop(1, '#2a1a5e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    for (const s of bgStars) {
      s.y += s.s * dt * .1; if (s.y > 1) s.y = 0;
      ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin((performance.now() / 1000) * s.s * 8 + s.x * 10));
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (state === 'menu') return;

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 14 * shake, (Math.random() - .5) * 14 * shake);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '34px serif';
    for (const it of items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      ctx.fillText(KINDS[it.kind].emoji, 0, 0); ctx.restore();
    }
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / .6); ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Savat
    const by = H - 70, bw = basket.w;
    ctx.fillStyle = '#ffd84d'; ctx.shadowColor = '#ffd84d'; ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(basket.x - bw / 2, by - 10); ctx.lineTo(basket.x + bw / 2, by - 10);
    ctx.lineTo(basket.x + bw / 2 - 14, by + 22); ctx.lineTo(basket.x - bw / 2 + 14, by + 22);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#b8941a'; ctx.fillRect(basket.x - bw / 2, by - 12, bw, 5);
    ctx.restore();

    // HUD
    ctx.textAlign = 'left'; ctx.font = 'bold 26px system-ui, sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText('⭐ ' + score, 16, 32);
    ctx.font = '22px serif'; ctx.fillText('❤️'.repeat(lives), 16, 64);
    ctx.textAlign = 'right'; ctx.font = '16px system-ui, sans-serif'; ctx.fillStyle = '#c9cff5';
    ctx.fillText('Rekord: ' + best, W - 16, 30);
    if (combo >= 10) {
      ctx.fillStyle = '#ffd84d'; ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.fillText('KOMBO x' + (1 + Math.floor(combo / 10)), W - 16, 58);
    }
  }

  function gameOver() {
    state = 'over';
    const isNew = score > best;
    if (isNew) { best = score; store.set('yulduz_best', best); }
    big.textContent = '⭐ ' + score;
    msg.innerHTML = isNew ? '🏆 Yangi rekord!' : 'O\'yin tugadi! Rekord: ' + best;
    btn.textContent = 'QAYTA O\'YNASH';
    ui.classList.remove('hidden');
  }

  function start() {
    reset(); state = 'play'; paused = false; ui.classList.add('hidden'); beep(440, .1, 'triangle');
  }
  btn.addEventListener('click', start);

  function setTarget(x) { if (state === 'play') basket.tx = x; }
  cv.addEventListener('pointerdown', e => setTarget(e.clientX));
  cv.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || e.buttons || true) setTarget(e.clientX); });
  addEventListener('keydown', e => {
    keys[e.key] = true;
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
    if (e.key === 'p' || e.key === 'Escape') paused = !paused;
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  // Fon rejimiga o'tganda pauza
  document.addEventListener('visibilitychange', () => { if (document.hidden) paused = true; else paused = false; });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (state === 'play' && !paused) update(dt);
    draw(dt);
    if (paused && state === 'play') {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 36px system-ui';
      ctx.fillText('PAUZA', W / 2, H / 2);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
